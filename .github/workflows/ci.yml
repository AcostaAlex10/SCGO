name: CI

# Verificacion automatica de lo que hoy se verifica a mano (ADR-001, fase 5).
#
# Tres jobs independientes: el backend (PHPStan + PHPUnit contra MariaDB), el
# frontend (tipos + build) y las cinco suites de Playwright contra la demo
# estatica.
#
# NO toca la rama `testing`: esa esta congelada, la publica
# `pages-testing.yml` y es lo que ven los testers. Este workflow corre en
# `main` y en los pull request hacia `main`.
#
# Tampoco toca ninguna base real: las pruebas de integracion solo miran las
# variables SGSO_TEST_DB_*, que aca apuntan al servicio efimero de MariaDB.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Backend (PHPStan + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: sgso
          MARIADB_DATABASE: sgso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          # pcov mide cobertura sin el costo de xdebug.
          coverage: pcov

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      # Acá se auditan todas, también las de desarrollo, a diferencia del front.
      # El backend no tiene ninguna de producción (con --no-dev, composer audit
      # falla por no encontrar paquetes), y las de desarrollo son 28, todas de
      # PHPUnit y PHPStan: poco ruido, y corren en el CI con acceso a la base de
      # pruebas (A-10).
      - name: Dependencias sin vulnerabilidades conocidas
        run: composer audit

      - name: Analisis estatico
        run: composer phpstan

      - name: Pruebas
        env:
          SGSO_TEST_DB_HOST: 127.0.0.1
          SGSO_TEST_DB_PORT: '3306'
          SGSO_TEST_DB_NAME: sgso_test
          SGSO_TEST_DB_USER: root
          SGSO_TEST_DB_PASSWORD: sgso
        run: composer test -- --coverage-text

  front:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT

    steps:
      - uses: actions/checkout@v7

      # La versión de Node sale de "engines" en FRONT/package.json, la misma que
      # usa Vercel: así el CI compila con lo que compila producción.
      - uses: actions/setup-node@v7
        with:
          node-version-file: FRONT/package.json

      # --legacy-peer-deps es necesario por conflictos de peers del proyecto.
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      # Frena el CI un aviso alto o crítico en lo que llega al navegador. Las
      # herramientas de desarrollo no: un aviso nuevo en una de ellas dejaría sin
      # poder mergear ningún PR, aunque no tuviera nada que ver. Esas las cubre
      # Dependabot (A-10).
      - name: Dependencias sin vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      # Los headers los sirve Vercel, no el código: si alguien los saca de
      # vercel.json, ningún build falla y nadie se entera (A-07).
      - name: vercel.json declara los headers de seguridad
        run: node ../.github/scripts/headers-vercel.mjs

  e2e:
    name: Playwright (demo estatica)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT

    steps:
      - uses: actions/checkout@v7

      # La versión de Node sale de "engines" en FRONT/package.json, la misma que
      # usa Vercel: así el CI compila con lo que compila producción.
      - uses: actions/setup-node@v7
        with:
          node-version-file: FRONT/package.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Instalar Playwright con Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Mismos parametros que pages-testing.yml: la demo se sirve bajo
      # /<repo>/ y rutea por fragmento.
      - name: Compilar el modo estatico
        env:
          BASE_PATH: './'
          VITE_HASH_ROUTER: '1'
          VITE_MOCK: '1'
        run: npm run build

      # Las suites esperan el sitio colgando de un subdirectorio con el nombre
      # del repositorio, que es como lo sirve GitHub Pages.
      - name: Servir la demo
        run: |
          mkdir -p /tmp/scgo
          ln -sfn "$PWD/dist" /tmp/scgo/SCGO
          npx --yes http-server /tmp/scgo -p 8123 -c-1 --silent &
          npx --yes wait-on -t 60000 http://127.0.0.1:8123/SCGO/

      - name: Correr las cinco suites
        run: |
          node scripts/pruebas/humo.mjs
          node scripts/pruebas/inactividad.mjs
          node scripts/pruebas/validaciones.mjs
          node scripts/pruebas/persistencia.mjs
          node scripts/pruebas/contrato.mjs

  docker:
    name: Imagen Docker (arranque seguro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Construye la misma imagen que despliega Render.
      - name: Construir la imagen
        run: docker build -t scgo-api back

      # El login normaliza el email con mb_strtolower (A-03): sin mbstring,
      # nadie podria entrar.
      - name: La imagen trae las extensiones que usa el codigo
        run: docker run --rm scgo-api php -r 'foreach (["mbstring", "pdo_mysql"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "Falta la extension $e\n"); exit(1); } } echo "ok\n";'

      # Sin JWT_SECRET la API no atiende pedidos (A-02).
      - name: Sin secreto, falla cerrado
        run: |
          docker run -d --name sin-secreto -p 8081:80 scgo-api
          npx --yes wait-on -t 60000 tcp:127.0.0.1:8081
          codigo=$(curl -s -o cuerpo.json -w '%{http_code}' http://127.0.0.1:8081/api/health)
          echo "HTTP $codigo"; cat cuerpo.json; echo
          test "$codigo" = "500"
          grep -q '"referencia"' cuerpo.json
          sleep 2
          docker logs sin-secreto 2>&1 | grep -q 'JWT_SECRET no est'

      # Con la base caída, el cliente no ve nada interno (A-04).
      - name: Con la base caída, no filtra detalles
        run: |
          docker run -d --name sin-base -p 8082:80 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DB_HOST=127.0.0.1 -e DB_PORT=1 \
            -e DB_USER=usuario_de_prueba -e DB_NAME=base_de_prueba \
            scgo-api
          npx --yes wait-on -t 60000 tcp:127.0.0.1:8082
          codigo=$(curl -s -D cabeceras.txt -o cuerpo.json -w '%{http_code}' http://127.0.0.1:8082/api/health)
          echo "HTTP $codigo"; cat cuerpo.json; echo
          test "$codigo" = "500"
          grep -q '"referencia"' cuerpo.json
          if grep -Eiq 'SQLSTATE|PDO|usuario_de_prueba|base_de_prueba|/var/www|Stack trace|Fatal error' cuerpo.json; then
            echo "La respuesta filtra detalles internos"; exit 1
          fi
          if grep -qi '^X-Powered-By' cabeceras.txt; then
            echo "La respuesta anuncia la versión de PHP"; exit 1
          fi
          if grep -Eiq '^Server:.*[0-9]' cabeceras.txt; then
            echo "La respuesta anuncia la versión del servidor"; exit 1
          fi
          sleep 2
          docker logs sin-base 2>&1 | grep -q 'SQLSTATE'

      # La API también responde en el navegador (el front la llama por fetch), y
      # una respuesta JSON mal interpretada es la base de varios ataques (A-07).
      - name: La API manda los headers de seguridad
        run: |
          curl -s -D cabeceras-api.txt -o /dev/null http://127.0.0.1:8082/api/health
          cat cabeceras-api.txt
          for h in 'X-Content-Type-Options: nosniff' 'Referrer-Policy: no-referrer' \
                   "Content-Security-Policy: default-src 'none'; frame-ancestors 'none'"; do
            if ! grep -qi "^${h}" cabeceras-api.txt; then
              echo "Falta el header: ${h}"; exit 1
            fi
          done
