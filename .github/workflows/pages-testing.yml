name: Publicar sitio de prueba (GitHub Pages)

# Publica el frontend en modo de prueba estatico (VITE_MOCK=1): sin backend,
# sin base de datos y con los datos de `FRONT/src/app/mock/datos.json`.
#
# No afecta al despliegue de Vercel: aquel compila sin VITE_MOCK y sigue
# consumiendo la API PHP de Render.
#
# Configuracion necesaria en el repositorio, una sola vez:
#   Settings -> Pages -> Source: "GitHub Actions".
#
# Sin eso el despliegue falla con "Failed to create deployment (status: 404)
# ... Ensure GitHub Pages has been enabled", aunque el job de compilacion pase.
#
# Corre solo en `testing`, que es la rama del sitio estatico. `main` lleva la
# aplicacion real (la SPA contra la API PHP, desplegada en Vercel) y no debe
# republicar la demo: Pages sirve un unico sitio por repositorio, asi que si
# ambas ramas publicaran se pisarian entre si.

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT
    steps:
      - uses: actions/checkout@v7

      # La versión de Node sale de "engines" en FRONT/package.json, la misma que
      # usa Vercel: así el CI compila con lo que compila producción.
      - uses: actions/setup-node@v7
        with:
          node-version-file: FRONT/package.json

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar en modo de prueba
        env:
          # Rutas relativas: el sitio funciona bajo /<repo>/ sin depender del
          # nombre del repositorio.
          BASE_PATH: './'
          # Las rutas viajan en el fragmento (#/proyectos), asi recargar una
          # ruta interna no depende de que el hosting reescriba a index.html.
          VITE_HASH_ROUTER: '1'
          VITE_MOCK: '1'
        run: npm run build

      - name: Fallback de rutas para la SPA
        # Red de seguridad por si alguien entra a una ruta sin fragmento.
        run: cp dist/index.html dist/404.html

      - name: Desactivar el procesado Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: FRONT/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
